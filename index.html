<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph 可视化交互台</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/vis-network/styles/vis-network.min.css"
    />
    <style>
      :root {
        --bg: #f4f1ea;
        --panel: #fffdf8;
        --ink: #202124;
        --muted: #6b7280;
        --line: #d9d2c3;
        --accent: #0b7285;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 0%, #e8f2f4 0%, transparent 35%),
          radial-gradient(circle at 90% 100%, #f8ead6 0%, transparent 40%),
          var(--bg);
      }

      .app {
        max-width: 1280px;
        margin: 24px auto;
        padding: 0 16px;
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 16px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 15px;
      }

      .section {
        margin-bottom: 14px;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      select,
      button,
      input[type="file"] {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        background: #fff;
        color: var(--ink);
      }

      button {
        cursor: pointer;
        border-color: #b5d7dd;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }

      #network {
        height: min(82vh, 900px);
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }

      #status {
        font-size: 13px;
        color: var(--muted);
      }

      @media (max-width: 1000px) {
        .app {
          grid-template-columns: 1fr;
        }

        #network {
          height: 68vh;
        }
      }
          /* Custom context menu item styles */
      #customContextMenu ul li {
        padding: 4px 8px;
        cursor: pointer;
        color: #232;
        border-radius: 3px;
        transition: background 0.14s;
        user-select: none;
      }
      #customContextMenu ul li.selected {
        background: #bee6fc !important;
        color: #165699 !important;
        font-weight: bold;
      }
      #customContextMenu ul li:hover {
        background: #e2eaff;
      }
      #customContextMenu ul li.hidden {
        color: #b3b3b3;
        background: #f6f6f8;
        text-decoration: line-through;
        cursor: not-allowed;
      }
      #customContextMenu ul li:active:not(.hidden) {
        background: #cbd4eb;
      }
</style>
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>Graph 互动可视化</h1>

        <div class="section">
          <h2>1) 导入 DOT</h2>
          <div class="row">
            <input id="fileInput" type="file" accept=".gv,.dot,.txt" />
            <button id="renderBtn" class="primary">渲染 Graph</button>
          </div>
          <p class="hint">导入后可直接渲染；当前不在左侧显示 DOT 文本内容。</p>
          <p id="status">等待渲染</p>
        </div>

        <div class="section">
          <h2>2) 布局选项</h2>
          <div class="row">
            <select id="layoutSelect">
              <option value="ruleBased">默认分层（组成关系递推）</option>
              <option value="fromDot">层级布局（按 rankdir）</option>
              <option value="hierarchicalTB">层级布局（上->下）</option>
              <option value="hierarchicalLR">层级布局（左->右）</option>
              <option value="force">力导向布局</option>
              <option value="circle">圆形布局</option>
            </select>
            <button id="applyLayoutBtn">应用布局</button>
            <button id="expandAllCollapsedBtn">展开全部收缩</button>
          </div>
          <p class="hint">点节点后高亮；双击节点可收缩/展开；Alt+单击父节点可选择恢复某个收缩子节点。</p>

          <div id="restorePanel" class="section" style="display: none; margin-top: 10px;">
            <h2>恢复收缩节点</h2>
            <p id="restoreParentInfo" class="hint">父节点：</p>
            <div class="row">
              <select id="restoreChildSelect" style="min-width: 220px;"></select>
              <button id="restoreConfirmBtn" class="primary">恢复所选</button>
              <button id="restoreCancelBtn">关闭</button>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>3) 节点文本显示</h2>
          <div class="row">
            <button id="toggleNodeTextBtn">切换为显示 ID</button>
          </div>
          <p id="nodeTextModeInfo" class="hint">当前显示：Label</p>
        </div>
      </section>

      <section class="panel">
        <div id="network"></div>
      </section>
    </main>

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="./app.js"></script>
    <div id="customContextMenu" style="display:none; position:absolute; z-index:9999; 
  min-width:190px;
  background: #fff;
  border: 1.5px solid #d4cfc4;
  border-radius: 7px;
  box-shadow: 0 3px 18px rgba(80,80,120,0.09),0 1.8px 0 #ece4d0;
  opacity: 1;
  padding:0;
  pointer-events:auto;
  user-select:none;
  font-size:15px;
"></div>
  </body>
</html>
