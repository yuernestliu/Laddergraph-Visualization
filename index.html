<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph 可视化交互台</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --panel: #fffdf8;
        --ink: #202124;
        --muted: #6b7280;
        --line: #d9d2c3;
        --accent: #0b7285;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 0%, #e8f2f4 0%, transparent 35%),
          radial-gradient(circle at 90% 100%, #f8ead6 0%, transparent 40%),
          var(--bg);
      }

      .app {
        width: min(1600px, calc(100vw - 32px));
        margin: 12px auto;
        padding: 0 0 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      }

      .control-sections {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 8px 12px;
      }

      .control-sections .section {
        min-width: 0;
      }

      .control-sections .row {
        flex-wrap: nowrap;
      }

      .control-sections .row > * {
        min-width: 0;
      }

      .branch-extract-panel {
        width: 100%;
      }

      .branch-extract-panel[hidden] {
        display: none;
      }

      .compact-btn {
        padding: 5px 8px;
        font-size: 12px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      h2 {
        margin: 0 0 4px;
        font-size: 13px;
      }

      .section {
        margin: 0;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .tab-strip {
        display: flex;
        gap: 8px;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 2px;
        margin-bottom: 6px;
      }

      .tab-strip[hidden] {
        display: none;
      }

      .tab-button {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 10px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        font-size: 12px;
      }

      .tab-button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      select,
      button,
      input[type="file"] {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 9px;
        background: #fff;
        color: var(--ink);
      }

        button {
          cursor: pointer;
          border-color: #b5d7dd;
        }

        button:disabled,
        select:disabled,
        input:disabled {
          cursor: not-allowed;
          opacity: 0.6;
        }

      #fileInput {
        width: 250px;
        flex: 0 1 250px;
        max-width: 100%;
      }

      #renderBtn {
        flex: 0 0 auto;
        white-space: nowrap;
      }

      #layoutSelect {
        min-width: 0;
        flex: 1 1 auto;
      }

      #applyLayoutBtn {
        flex: 0 0 auto;
        white-space: nowrap;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }

      #network {
        height: min(84vh, 980px);
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
        position: relative;
        overflow: hidden;
        cursor: grab;
        user-select: none;
        touch-action: none;
      }

      #network.is-panning {
        cursor: grabbing;
      }

      #network.is-rendering::after {
        content: "Graphviz 渲染中...";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.68);
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.02em;
      }

      .graphviz-svg {
        pointer-events: auto;
      }

      .graphviz-svg g.node {
        cursor: pointer;
      }

      .graphviz-svg g.node text,
      .graphviz-svg g.edge text {
        transition: fill 120ms ease;
      }

      .graphviz-svg g.node ellipse,
      .graphviz-svg g.node circle,
      .graphviz-svg g.node polygon,
      .graphviz-svg g.node path,
      .graphviz-svg g.node rect,
      .graphviz-svg g.edge path,
      .graphviz-svg g.edge polygon,
      .graphviz-svg g.edge polyline {
        transition:
          fill 120ms ease,
          stroke 120ms ease,
          stroke-width 120ms ease;
      }

      .network-shell {
        position: relative;
      }

      .overlay-controls {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 4;
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }

      .layer-controls {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: stretch;
        padding-left: 10px;
        border-left: 1px solid rgba(185, 177, 163, 0.72);
      }

      .layer-controls .row {
        flex-direction: row;
        gap: 6px;
        flex-wrap: nowrap;
        align-items: stretch;
      }

      .layer-controls .hint {
        margin: 0;
        padding: 4px 8px;
        background: rgba(255, 253, 248, 0.9);
        border: 1px solid rgba(217, 210, 195, 0.92);
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        max-width: 150px;
      }

      .zoom-controls {
        display: flex;
        flex-direction: row;
        gap: 6px;
        align-items: flex-start;
      }

      .zoom-controls button {
        min-width: 38px;
        min-height: 34px;
        padding: 0 10px;
        font-size: 18px;
        line-height: 1;
        background: rgba(232, 242, 244, 0.96);
        border-color: #9fd0d8;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      }

      .zoom-controls button.fit-btn {
        font-size: 12px;
        font-weight: 600;
      }

      .overlay-controls .layer-controls button {
        font-size: 12px;
        min-width: 0;
        min-height: 34px;
        padding: 0 10px;
        background: rgba(255, 253, 248, 0.92);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      }

      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
        line-height: 1.35;
      }

      .graph-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }

      #status {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
      }

      @media (max-width: 1000px) {
        .control-sections .row {
          flex-wrap: wrap;
        }

        #network {
          height: 68vh;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="control-sections">
          <div class="section">
            <h2>导入</h2>
            <div class="row">
              <input id="fileInput" type="file" accept=".gv,.dot,.txt" />
              <button id="renderBtn" class="primary compact-btn">渲染</button>
            </div>
          </div>

          <div class="section">
            <h2>布局</h2>
            <div class="row">
              <select id="layoutSelect">
                <option value="hierarchicalTB">层级布局（下->上）</option>
                <option value="hierarchicalLR">层级布局（左->右）</option>
                <option value="ruleBased">分层布局（组成关系递推）</option>
                <option value="force">力导向布局</option>
              </select>
              <button id="applyLayoutBtn">应用布局</button>
            </div>
          </div>

          <div class="section">
            <h2>文本</h2>
            <div class="row">
              <button id="toggleNodeTextBtn">切换为显示 ID</button>
            </div>
            <p id="nodeTextModeInfo" class="hint">当前显示：Label</p>
          </div>

          <div class="section">
            <h2>节点尺寸</h2>
            <div class="row">
              <select id="nodeSizeModeSelect">
                <option value="fixed">固定</option>
                <option value="sqrt" selected>sqrt(S)</option>
                <option value="cbrt">S^(1/3)</option>
                <option value="log">log(S+1)</option>
                <option value="linear">S</option>
              </select>
            </div>
          </div>

          <div class="section">
            <h2>视窗</h2>
            <div class="row">
              <button id="newCustomViewBtn" class="compact-btn" type="button">新建视窗</button>
            </div>
            <div id="branchExtractContainer" class="branch-extract-panel" style="display: none;">
              <div class="row" style="margin-top: 6px;">
                <select id="branchExtractModeSelect">
                  <option value="node">按节点</option>
                  <option value="layer">按层数</option>
                </select>
              </div>
              <div id="branchExtractNodePanel" class="branch-extract-panel">
                <div class="row" style="margin-top: 6px;">
                  <select id="branchModeSelect">
                    <option value="all">上下游全分支</option>
                    <option value="up">仅上游</option>
                    <option value="down">仅下游</option>
                    <option value="adjacent">一跳邻接</option>
                    <option value="free">自由选择</option>
                  </select>
                  <button id="extractSubgraphBtn" class="compact-btn" type="button">按节点提取</button>
                </div>
                <div id="freeModePanel" class="row" style="margin-top: 6px;">
                  <label class="hint">上游层数</label>
                  <input id="subUpLevel" type="number" min="0" value="2" style="width: 70px;" />
                  <label class="hint">下游层数</label>
                  <input id="subDownLevel" type="number" min="0" value="2" style="width: 70px;" />
                </div>
                <p id="subgraphSelectInfo" class="hint">未选择节点</p>
              </div>
              <div id="branchExtractLayerPanel" class="branch-extract-panel" style="display: none;">
                <div class="row" style="margin-top: 6px;">
                  <label class="hint">上游层数</label>
                  <input id="layerUpLevel" type="number" min="0" value="2" style="width: 70px;" />
                  <label class="hint">下游层数</label>
                  <input id="layerDownLevel" type="number" min="0" value="2" style="width: 70px;" />
                  <button id="extractLayerBtn" class="compact-btn" type="button">按层提取</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div id="graphTabs" class="tab-strip" hidden></div>
        <div class="graph-meta">
          <p id="graphTabsInfo" class="hint">当前显示：全图</p>
          <p id="status" hidden></p>
        </div>
        <div class="network-shell">
          <div class="overlay-controls">
            <div class="zoom-controls">
              <button id="zoomInBtn" type="button" aria-label="放大">+</button>
              <button id="zoomOutBtn" type="button" aria-label="缩小">-</button>
              <button id="fitViewBtn" type="button" class="fit-btn" aria-label="适中">适中</button>
            </div>
            <div class="layer-controls">
              <div class="row">
                <button id="layerDepthUpBtn" class="compact-btn" type="button">深1层</button>
                <button id="layerDepthDownBtn" class="compact-btn" type="button">浅1层</button>
                <button id="layerDepthAutoBtn" class="compact-btn" type="button">合适层级</button>
                <button id="layerDepthAllBtn" class="compact-btn" type="button">全部层</button>
              </div>
            </div>
          </div>
          <div id="network"></div>
        </div>
      </section>
    </main>

    <script type="module" src="./graphviz-app.js"></script>
  </body>
</html>
